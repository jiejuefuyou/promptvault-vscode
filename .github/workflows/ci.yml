name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: promptvault-vscode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Extension contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify package, bundled data and command core
        run: npm run verify
